[pytest]
# 只在 tests/ 下收集：仓库根还有 venv/、reports/（含从服务器拉回的归档，其中有
# >260 字符的 Windows 长路径，会让 pytest 在收集阶段直接 AssertionError 崩掉）。
# 没有这个配置时 `pytest`（不带参数）会从根目录递归，收集结果既不确定也不可比。
testpaths = tests
# MSR_20_Code_vulnerability_CSV_Dataset 是**数据**不是测试代码，且其中 4 个路径 >260 字符，
# 在 Windows 上 pytest 走到收集阶段会 stat 失败并直接 AssertionError 崩掉整轮收集。
norecursedirs = reports venv .git .* build dist node_modules __pycache__ _pytest_tmp* MSR_20_Code_vulnerability_CSV_Dataset
addopts = -ra
